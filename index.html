<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Староста">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Староста</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.4;
  background:#f5f5f3;
  color:#0a0a0a;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
@media(prefers-color-scheme:dark){
  body{background:#0a0a0a;color:#f5f5f3}
}

/* ===== ТИПОГРАФИКА ===== */
.serif{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif}
.display{font-family:ui-serif,"New York",Georgia,serif;font-weight:900;letter-spacing:-0.04em;line-height:0.9}

/* ===== HEADER ===== */
.hero{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:0;
  border-bottom:3px solid #0a0a0a;
  padding-bottom:16px;
  margin-bottom:20px;
  min-height:180px;
}
@media(prefers-color-scheme:dark){.hero{border-color:#f5f5f3}}
.hero-left{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:8px 16px 8px 0;
  border-right:3px solid #0a0a0a;
}
@media(prefers-color-scheme:dark){.hero-left{border-color:#f5f5f3}}
.hero-arrow{
  font-size:72px;
  line-height:0.8;
  font-weight:900;
  color:#0a0a0a;
}
@media(prefers-color-scheme:dark){.hero-arrow{color:#f5f5f3}}
.hero-tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:8px;
}
.hero-tag{
  font-size:10px;
  font-weight:600;
  padding:3px 8px;
  border:1.5px solid #0a0a0a;
  border-radius:0;
  text-transform:uppercase;
  letter-spacing:0.05em;
  background:transparent;
  color:#0a0a0a;
}
@media(prefers-color-scheme:dark){.hero-tag{border-color:#f5f5f3;color:#f5f5f3}}
.hero-right{
  background:#1a1aff;
  color:#fff;
  padding:16px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  position:relative;
  overflow:hidden;
}
.hero-right .year{
  font-family:ui-serif,Georgia,serif;
  font-weight:900;
  font-size:48px;
  letter-spacing:-0.04em;
  line-height:0.9;
  position:relative;
  z-index:2;
}
.hero-right .title-scrambled{
  position:absolute;
  right:-10px;
  top:50%;
  transform:translateY(-50%) rotate(-12deg);
  font-family:ui-serif,Georgia,serif;
  font-weight:900;
  font-size:52px;
  letter-spacing:-0.05em;
  line-height:0.85;
  color:rgba(255,255,255,0.15);
  white-space:nowrap;
}

/* ===== NAV TABS (как About me / Resume / Work) ===== */
.nav-tabs{
  display:flex;
  border-bottom:2px solid #0a0a0a;
  margin-bottom:20px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none}
@media(prefers-color-scheme:dark){.nav-tabs{border-color:#f5f5f3}}
.nav-tab{
  flex:none;
  padding:10px 16px;
  font-size:13px;
  font-weight:600;
  color:#6b6b6b;
  background:none;
  border:0;
  border-bottom:3px solid transparent;
  margin-bottom:-2px;
  cursor:pointer;
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.nav-tab.on{
  color:#0a0a0a;
  border-bottom-color:#1a1aff;
}
@media(prefers-color-scheme:dark){
  .nav-tab{color:#8a8a8a}
  .nav-tab.on{color:#f5f5f3}
}

/* ===== LAYOUT ===== */
#app{max-width:640px;margin:0 auto;padding:0 16px 24px}

h2.section-title{
  font-family:ui-serif,Georgia,serif;
  font-weight:900;
  font-size:28px;
  letter-spacing:-0.03em;
  line-height:1;
  margin:24px 0 14px;
  display:flex;
  align-items:center;
  gap:10px;
}
h2.section-title .count{
  font-size:14px;
  font-weight:600;
  padding:3px 10px;
  border:1.5px solid #0a0a0a;
  border-radius:0;
  letter-spacing:0;
  font-family:-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){h2.section-title .count{border-color:#f5f5f3}}

h3{
  font-family:ui-serif,Georgia,serif;
  font-weight:700;
  font-size:18px;
  margin:16px 0 8px;
  letter-spacing:-0.02em;
}

.mut,small{color:#6b6b6b;font-size:12px}
@media(prefers-color-scheme:dark){.mut,small{color:#8a8a8a}}

/* ===== CARDS ===== */
.card{
  background:#fff;
  border:2px solid #0a0a0a;
  border-radius:0;
  padding:14px;
  margin-bottom:10px;
}
@media(prefers-color-scheme:dark){
  .card{background:#141414;border-color:#f5f5f3}
}
.card.black{
  background:#0a0a0a;
  color:#fff;
  border-color:#0a0a0a;
}
@media(prefers-color-scheme:dark){.card.black{background:#f5f5f3;color:#0a0a0a;border-color:#f5f5f3}}
.card.black .mut{color:rgba(255,255,255,0.6)}
@media(prefers-color-scheme:dark){.card.black .mut{color:rgba(0,0,0,0.6)}}

.card.blue{
  background:#1a1aff;
  color:#fff;
  border-color:#1a1aff;
}
.card.blue .mut{color:rgba(255,255,255,0.75)}

.card.les{
  border-left:6px solid #1a1aff;
}
.card.danger{
  border-left:6px solid #ff2d2d;
}

.card-quote{
  border:2px solid #0a0a0a;
  border-radius:0;
  padding:14px 16px;
  margin:10px 0;
  font-family:ui-serif,Georgia,serif;
  font-size:15px;
  font-weight:500;
  background:#fff;
  position:relative;
}
@media(prefers-color-scheme:dark){.card-quote{border-color:#f5f5f3;background:#141414}}

/* ===== BUTTONS ===== */
button,input,select,textarea{font:inherit;color:inherit}
button{
  background:#0a0a0a;
  color:#fff;
  border:0;
  border-radius:0;
  padding:11px 18px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:0.05em;
  transition:transform .1s;
}
button:active{transform:scale(0.97)}
button.pr{background:#1a1aff;color:#fff}
button.ghost{background:transparent;color:#0a0a0a;border:2px solid #0a0a0a}
@media(prefers-color-scheme:dark){button.ghost{color:#f5f5f3;border-color:#f5f5f3}}
button.dg{background:#ff2d2d;color:#fff}
button.sm{padding:7px 12px;font-size:11px}
h2.section-title button{font-size:11px;padding:7px 14px}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts button{flex:1}

/* ===== FORMS ===== */
input,select,textarea{
  width:100%;
  background:#fff;
  border:2px solid #0a0a0a;
  border-radius:0;
  padding:12px 14px;
  margin:6px 0 10px;
  font-size:14px;
}
@media(prefers-color-scheme:dark){input,select,textarea{background:#141414;border-color:#f5f5f3}}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a1aff}
label{
  font-size:10px;
  color:#6b6b6b;
  text-transform:uppercase;
  letter-spacing:0.1em;
  font-weight:700;
  display:block;
  margin-top:12px;
}
textarea{min-height:100px;resize:vertical;font-family:inherit}

/* ===== BOTTOM NAV ===== */
#tabs{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:#fff;
  border-top:2px solid #0a0a0a;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:5;
}
@media(prefers-color-scheme:dark){#tabs{background:#0a0a0a;border-color:#f5f5f3}}
#tabs button{
  flex:1;
  background:none;
  border-radius:0;
  padding:10px 4px 8px;
  font-size:9px;
  color:#6b6b6b;
  line-height:1.2;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.05em;
  border:0;
}
#tabs button.on{color:#0a0a0a;font-weight:800}
@media(prefers-color-scheme:dark){#tabs button.on{color:#f5f5f3}}
#tabs span{display:block;font-size:18px;margin-bottom:2px}

/* ===== PILLS / TAGS ===== */
.pill{
  display:inline-block;
  min-width:32px;
  text-align:center;
  padding:4px 10px;
  border-radius:0;
  font-weight:800;
  font-size:11px;
  background:#fff;
  color:#0a0a0a;
  border:1.5px solid #0a0a0a;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
@media(prefers-color-scheme:dark){.pill{background:#141414;color:#f5f5f3;border-color:#f5f5f3}}
.pill.ok{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
@media(prefers-color-scheme:dark){.pill.ok{background:#f5f5f3;color:#0a0a0a;border-color:#f5f5f3}}
.pill.bad{background:#ff2d2d;color:#fff;border-color:#ff2d2d}
.pill.warn{background:#ff8c00;color:#fff;border-color:#ff8c00}
.pill.blue{background:#1a1aff;color:#fff;border-color:#1a1aff}

.tag{
  display:inline-block;
  padding:3px 8px;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  background:#fff;
  color:#0a0a0a;
  margin:2px;
  border:1.5px solid #0a0a0a;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
@media(prefers-color-scheme:dark){.tag{background:#141414;color:#f5f5f3;border-color:#f5f5f3}}

/* ===== ROWS ===== */
.row{display:flex;align-items:center;gap:12px}
.fl{flex:1;min-width:0}
.tm{font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;font-size:15px;font-family:ui-serif,Georgia,serif}
.srow{
  padding:12px 4px;
  border-bottom:1px solid #0a0a0a;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
@media(prefers-color-scheme:dark){.srow{border-color:#f5f5f3}}
.srow:last-child{border-bottom:0}
.srow .name{font-weight:700;font-size:14px}

/* ===== SHEET ===== */
.sheet{position:fixed;inset:0;display:none;z-index:9}
.sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,0.7)}
.pn{
  position:absolute;left:0;right:0;bottom:0;
  max-height:90%;overflow:auto;
  background:#fff;
  border-top:3px solid #0a0a0a;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
@media(prefers-color-scheme:dark){.pn{background:#0a0a0a;border-color:#f5f5f3}}
.pn h3{margin-top:0;font-size:22px}

/* ===== TOAST ===== */
#toast{
  position:fixed;left:50%;bottom:100px;
  transform:translateX(-50%);
  background:#0a0a0a;color:#fff;
  padding:10px 18px;
  font-size:12px;font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
  opacity:0;transition:.25s;pointer-events:none;z-index:20;
  border:2px solid #fff;
}
@media(prefers-color-scheme:dark){#toast{background:#f5f5f3;color:#0a0a0a;border-color:#0a0a0a}}
#toast.on{opacity:1}

/* ===== CHECKBOX HW ===== */
.chk{
  width:28px;height:28px;
  border-radius:0;
  border:2px solid #0a0a0a;
  padding:0;background:none;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;
}
@media(prefers-color-scheme:dark){.chk{border-color:#f5f5f3}}
.done .chk{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
@media(prefers-color-scheme:dark){.done .chk{background:#f5f5f3;color:#0a0a0a}}
.done .fl{opacity:0.4;text-decoration:line-through}

/* ===== EMPTY ===== */
.empty{text-align:center;color:#6b6b6b;padding:32px 16px;font-size:13px}
.empty .big{font-family:ui-serif,Georgia,serif;font-size:64px;margin-bottom:8px;opacity:0.2;font-weight:900}

/* ===== STATS ===== */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:12px 0;border:2px solid #0a0a0a}
@media(prefers-color-scheme:dark){.stats-grid{border-color:#f5f5f3}}
.stat-box{
  background:#fff;
  padding:16px 10px;
  text-align:center;
  border-right:1px solid #0a0a0a;
  border-bottom:1px solid #0a0a0a;
}
.stat-box:nth-child(2n){border-right:0}
.stat-box:nth-last-child(-n+2){border-bottom:0}
@media(prefers-color-scheme:dark){
  .stat-box{background:#141414;border-color:#f5f5f3}
}
.stat-box .num{font:900 36px/1 ui-serif,Georgia,serif;letter-spacing:-0.03em;color:#0a0a0a}
@media(prefers-color-scheme:dark){.stat-box .num{color:#f5f5f3}}
.stat-box .lbl{font-size:9px;color:#6b6b6b;margin-top:6px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700}
.stat-box.ok{background:#0a0a0a}
.stat-box.ok .num,.stat-box.ok .lbl{color:#fff}
@media(prefers-color-scheme:dark){.stat-box.ok{background:#f5f5f3}.stat-box.ok .num,.stat-box.ok .lbl{color:#0a0a0a}}
.stat-box.bad{background:#ff2d2d}
.stat-box.bad .num,.stat-box.bad .lbl{color:#fff}
.stat-box.warn{background:#ff8c00}
.stat-box.warn .num,.stat-box.warn .lbl{color:#fff}
.stat-box.blue{background:#1a1aff}
.stat-box.blue .num,.stat-box.blue .lbl{color:#fff}

.bar{height:8px;background:#fff;border:2px solid #0a0a0a;margin:10px 0;position:relative}
@media(prefers-color-scheme:dark){.bar{background:#141414;border-color:#f5f5f3}}
.bar-fill{height:100%;background:#0a0a0a;transition:width .4s}
@media(prefers-color-scheme:dark){.bar-fill{background:#f5f5f3}}
.bar-fill.ok{background:#0a0a0a}
@media(prefers-color-scheme:dark){.bar-fill.ok{background:#f5f5f3}}
.bar-fill.bad{background:#ff2d2d}
.bar-fill.warn{background:#ff8c00}

.percent-big{
  font:900 72px/1 ui-serif,Georgia,serif;
  text-align:center;
  margin:16px 0 8px;
  letter-spacing:-0.05em;
}

.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px dashed #0a0a0a;text-transform:uppercase;letter-spacing:0.05em}
@media(prefers-color-scheme:dark){.stat-row{border-color:#f5f5f3}}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{color:#6b6b6b;font-weight:600}
.stat-row .val{font-weight:800;font-variant-numeric:tabular-nums}

/* ===== REMINDERS ===== */
.reminder{
  border:2px solid #0a0a0a;
  border-left:6px solid #ff8c00;
  padding:12px 14px;
  margin:8px 0;
  background:#fff;
}
@media(prefers-color-scheme:dark){.reminder{border-color:#f5f5f3;background:#141414}}
.reminder.urgent{border-left-color:#ff2d2d;background:#ff2d2d;color:#fff}
.reminder.urgent .rd{color:rgba(255,255,255,0.85)}
.reminder.bday{border-left-color:#ff2d78;background:#ff2d78;color:#fff}
.reminder.bday .rd{color:rgba(255,255,255,0.85)}
.reminder .rt{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:0.03em}
.reminder .rd{font-size:10px;color:#6b6b6b;margin-top:4px;font-weight:700;letter-spacing:0.08em}

/* ===== EXAM ===== */
.exam-card{
  border:2px solid #0a0a0a;
  border-left:6px solid #1a1aff;
  padding:14px;
  margin:10px 0;
  background:#fff;
  cursor:pointer;
}
@media(prefers-color-scheme:dark){.exam-card{border-color:#f5f5f3;background:#141414}}
.exam-card .edate{font:800 11px/1 -apple-system,sans-serif;color:#1a1aff;text-transform:uppercase;letter-spacing:0.1em}
.exam-card .esubj{font-family:ui-serif,Georgia,serif;font-weight:900;font-size:20px;margin:6px 0 4px;letter-spacing:-0.02em}
.exam-card .emut{font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.05em;font-weight:600}
.countdown{
  font:900 22px/1 ui-serif,Georgia,serif;
  color:#ff2d2d;
  margin-top:10px;
  letter-spacing:-0.02em;
  text-transform:uppercase;
}
.countdown.today{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ===== DEBTORS ===== */
.debt-item{
  border:2px solid #0a0a0a;
  padding:12px 14px;
  margin:8px 0;
  display:flex;align-items:center;gap:12px;
  background:#fff;
  cursor:pointer;
}
@media(prefers-color-scheme:dark){.debt-item{border-color:#f5f5f3;background:#141414}}
.debt-item .rank{
  font:900 32px/1 ui-serif,Georgia,serif;
  color:#ff2d2d;
  min-width:40px;
  letter-spacing:-0.03em;
}
.debt-item .info{flex:1;min-width:0}
.debt-item .name{font-weight:800;font-size:14px}
.debt-item .meta{font-size:10px;color:#6b6b6b;margin-top:3px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700}

/* ===== NOTE ===== */
.note{
  margin-top:10px;
  padding:10px 12px;
  border-left:3px solid #1a1aff;
  background:#fff;
  border:2px solid #0a0a0a;
  border-left:6px solid #1a1aff;
  white-space:pre-wrap;
  font-size:12px;
  font-style:italic;
}
@media(prefers-color-scheme:dark){.note{background:#141414;border-color:#f5f5f3}}

/* ===== CHECKBOX COLS ===== */
.ck{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:#0a0a0a;
  margin:6px 0;
  padding:10px;
  border:2px solid #0a0a0a;
  cursor:pointer;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.03em;
  font-size:11px;
}
@media(prefers-color-scheme:dark){.ck{color:#f5f5f3;border-color:#f5f5f3}}
.ck input{width:18px;height:18px;margin:0;flex:none;border-radius:0}
.ck:hover{background:#0a0a0a;color:#fff}
@media(prefers-color-scheme:dark){.ck:hover{background:#f5f5f3;color:#0a0a0a}}

a{color:#1a1aff;font-weight:700;text-decoration:none}

/* ===== DECORATIVE ===== */
.deco-line{
  height:3px;
  background:#0a0a0a;
  margin:20px 0;
}
@media(prefers-color-scheme:dark){.deco-line{background:#f5f5f3}}

.intro-block{
  border:2px solid #0a0a0a;
  padding:14px 16px;
  margin:12px 0;
  background:#fff;
  font-family:ui-serif,Georgia,serif;
  font-size:14px;
  font-weight:500;
  line-height:1.5;
}
@media(prefers-color-scheme:dark){.intro-block{border-color:#f5f5f3;background:#141414}}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:0;
  border:2px solid #0a0a0a;
  margin:10px 0;
}
@media(prefers-color-scheme:dark){.contact-grid{border-color:#f5f5f3}}
.contact-cell{
  padding:14px 10px;
  text-align:center;
  border-right:1px solid #0a0a0a;
  background:#fff;
  cursor:pointer;
}
.contact-cell:last-child{border-right:0}
@media(prefers-color-scheme:dark){
  .contact-cell{background:#141414;border-color:#f5f5f3}
}
.contact-cell .ic{font-size:24px;margin-bottom:4px}
.contact-cell .lb{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#6b6b6b}
.contact-cell.blue{background:#1a1aff;color:#fff}
.contact-cell.blue .lb{color:rgba(255,255,255,0.8)}
.contact-cell.black{background:#0a0a0a;color:#fff}
@media(prefers-color-scheme:dark){.contact-cell.black{background:#f5f5f3;color:#0a0a0a}}
.contact-cell.black .lb{color:rgba(255,255,255,0.7)}
@media(prefers-color-scheme:dark){.contact-cell.black .lb{color:rgba(0,0,0,0.7)}}

/* ===== TIMELINE ===== */
.timeline-item{
  position:relative;
  padding:10px 0 10px 24px;
  border-left:2px solid #0a0a0a;
  margin-left:8px;
}

function studentAttStats(sid){

}

function statsBlock(s,title){

// ===== НАПОМИНАНИЯ =====
function getReminders(){
  const today=iso(new Date());
  const reminders=[];
  const in3days=iso(new Date(Date.now()+3*864e5));
  db.hw.filter(x=>!x.done&&x.due&&x.due>=today&&x.due<=in3days).forEach(h=>{
    const daysLeft=Math.ceil((pd(h.due)-new Date())/864e5);
    reminders.push({type:'hw',text:h.subj+' — '+h.text,date:h.due,urgent:daysLeft<=1,daysLeft});
  });
  const in7days=iso(new Date(Date.now()+7*864e5));
  db.students.forEach(s=>{
    if(!s.dob)return;
    const dob=s.dob;
    const thisYear=new Date().getFullYear();
    const bdayThisYear=thisYear+'-'+dob.slice(5);
    const bdayNextYear=(thisYear+1)+'-'+dob.slice(5);
    let bday=bdayThisYear;
    if(bdayThisYear<today)bday=bdayNextYear;
    if(bday>=today&&bday<=in7days){
      const daysLeft=Math.ceil((pd(bday)-new Date())/864e5);
      reminders.push({type:'bday',text:s.name,date:bday,urgent:daysLeft===0,daysLeft});
    }
  });
  const in14days=iso(new Date(Date.now()+14*864e5));
  db.exams.filter(x=>x.date&&x.date>=today&&x.date<=in14days).forEach(x=>{
    const daysLeft=Math.ceil((pd(x.date)-new Date())/864e5);
    reminders.push({type:'exam',text:x.type+' · '+x.subj,date:x.date,urgent:daysLeft<=2,daysLeft,time:x.time});
  });
  reminders.sort((a,b)=>a.date.localeCompare(b.date)||a.daysLeft-b.daysLeft);
  return reminders;
}

const SB={url:'https://jvnrfunimsbhoatbhoai.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2bnJmdW5pbXNiaG9hdGJob2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDQ5ODksImV4cCI6MjEwNjI4MDk4OX0.xwiQVKIz1k5MdjywyFjhe8g0aGjatYqtYAok1f9I-qo'};

function rowsOf(){const r={};db.students.forEach(x=>r['student:'+x.id]=x);db.teachers.forEach(x=>r['teacher:'+x.id]=x);db.lessons.forEach(x=>r['lesson:'+x.id]=x);db.hw.forEach(x=>r['hw:'+x.id]=x);db.exams.forEach(x=>r['exam:'+x.id]=x);for(const k in db.att)for(const s in db.att[k])r['att:'+k+':'+s]={k,s,v:db.att[k][s]};for(const k in db.notes)r['note:'+k]={k,t:db.notes[k]};r['cfg:ref']={ref:db.ref};return r}

if(!db.seeded){
 if(!db.lessons.length&&!db.teachers.length){
  const T=[['Иванова М.В.','асс. · Цифровые платформы'],['Бельмас С.М.','ст. пр. · Бизнес-архитектуры, ФЯП, Big Data'],['Ахметова М.И.','доц. · Финансовое моделирование'],['Широков А.А.','доц. · ОС, сети и телекоммуникации'],['Леонтьева С.М.','ст. пр. · Бухгалтерский и управленческий учёт']].map(([name,subj])=>({id:uid(),name,subj,phone:'',tg:'',mail:''}));

  db.teachers=T;

 }
 db.seeded=1;save();

 </div>`;
 
 // НАПОМИНАНИЯ

       else if(daysLeft===1)countdown='<div class="countdown"> ЗАВТРА</div>';
       else countdown=`<div class="countdown">Осталось ${daysLeft} дн.</div>`;
       h+=`<div class="exam-card" data-a="exam" data-i="${x.id}"><div class="edate">${x.date.slice(8)}.${x.date.slice(5,7)}${x.time?' · '+x.time:''}</div><div class="esubj">${esc(x.subj)}</div><div class="emut">${esc(x.type)}${x.teacher?' · '+tname(x.teacher):''}${x.room?' · '+esc(x.room):''}</div>${countdown}</div>`;
     });
   }
   if(past.length){
     h+='<h3 style="text-transform:uppercase;letter-spacing:0.08em;font-size:12px;color:#6b6b6b">Прошедшие</h3>';
     past.slice(0,5).forEach(x=>{
       h+=`<div class="exam-card" style="opacity:0.5" data-a="exam" data-i="${x.id}"><div class="edate">${x.date.slice(8)}.${x.date.slice(5,7)}</div><div class="esubj">${esc(x.subj)}</div><div class="emut">${esc(x.type)}</div></div>`;
     });
   }
 }
 return h}

function vGroup(){
 const gs=groupAttStats();
 let h='<h2 class="section-title">#Посещаемость</h2>';
 if(gs.total>0)h+=statsBlock(gs,'Группа');
 else h+='<div class="intro-block">Пока нет отметок. Отмечай студентов на парах — здесь появится статистика.</div>';
 
 const studentsWithStats=db.students.map(s=>({s,stats:studentAttStats(s.id)})).sort((a,b)=>{if(a.stats.total===0&&b.stats.total===0)return a.s.name.localeCompare(b.s.name,'ru');if(a.stats.total===0)return 1;if(b.stats.total===0)return -1;return a.stats.pct-b.stats.pct||a.s.name.localeCompare(b.s.name,'ru')});
 
 h+=`<h2 class="section-title">#Студенты <span class="count">'+db.students.length+'</span> <button class="pr" data-a="se">+ Добавить</button></h2><div class="card">`;
 h+=studentsWithStats.length?studentsWithStats.map(({s,stats},i)=>{const pctDisplay=stats.total?`${stats.pct}%`:'—';const barColor=stats.total?(stats.pct>=80?'ok':stats.pct>=60?'warn':'bad'):'';return `<div class="srow" data-a="sp" data-i="${s.id}"><div class="fl"><div class="name">${i+1}. ${esc(s.name)}</div>${s.fl?`<small class="mut" ${flOld(s)?'style="color:#ff2d2d;font-weight:700"':''}>флюра: ${fdate(s.fl)}${flOld(s)?' · больше года':''}</small>`:''}${stats.total?`<div class="bar" style="margin-top:6px"><div class="bar-fill ${barColor}" style="width:${stats.pct}%"></div></div><small class="mut" style="text-transform:uppercase;letter-spacing:0.05em;font-size:10px">посещ. ${pctDisplay} · н/б: ${stats.a}</small>`:''}</div><span class="pill ${stats.total?(stats.pct>=80?'ok':stats.pct>=60?'warn':'bad'):''}">${pctDisplay}</span></div>`}).join(''):'<div class="empty"><div class="big"></div>Добавь студентов</div>';
 h+='</div>'+expCard();
 
 h+='<h2 class="section-title">#Преподаватели <button class="pr" data-a="te" data-i="">+ Препод</button></h2>';
 h+=db.teachers.map(t=>`<div class="card"><div class="row" data-a="te" data-i="${t.id}"><div class="fl"><b class="serif" style="font-size:16px">${esc(t.name)}</b><div class="mut" style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-top:3px">${esc(t.subj)}</div></div></div><div class="contact-grid" style="margin-top:10px">${t.phone?`<a href="tel:${esc(t.phone)}" class="contact-cell black"><div class="ic">📞</div><div class="lb">Позвонить</div></a>`:''}${t.tg?`<a href="https://t.me/${esc(t.tg.replace('@',''))}" class="contact-cell blue"><div class="ic">✈️</div><div class="lb">Telegram</div></a>`:''}${t.mail?`<a href="mailto:${esc(t.mail)}" class="contact-cell"><div class="ic">✉️</div><div class="lb">Почта</div></a>`:''}</div></div>`).join('');
 return h}

function vDebtors(){
 const debtors=[];
 db.students.forEach(s=>{
   const att=studentAttStats(s.id);
   const overdueHw=db.hw.filter(h=>!h.done&&h.due&&h.due<iso(new Date())).length;
   const totalIssues=att.a+overdueHw;
   if(totalIssues>0||att.pct<80&&att.total>0){
     debtors.push({s,att,overdueHw,totalIssues});
   }
 });
 debtors.sort((a,b)=>b.totalIssues-a.totalIssues||a.att.pct-b.att.pct);
 
 let h='<h2 class="section-title">#Должники</h2>';
 if(!debtors.length){
   h+='<div class="card blue"><h3 style="margin:0;color:#fff;font-size:18px"> Отлично!</h3><small style="color:rgba(255,255,255,0.85);display:block;margin-top:4px">Должников и прогульщиков нет. Все молодцы!</small></div>';
 } else {
   debtors.forEach((d,i)=>{
     const reasons=[];
     if(d.att.a>0)reasons.push(`пропусков: ${d.att.a}`);
     if(d.overdueHw>0)reasons.push(`просрочено ДЗ: ${d.overdueHw}`);
     if(d.att.pct<80&&d.att.total>0)reasons.push(`посещ. ${d.att.pct}%`);
     h+=`<div class="debt-item" data-a="sp" data-i="${d.s.id}"><div class="rank">#${i+1}</div><div class="info"><div class="name">${esc(d.s.name)}</div><div class="meta">${reasons.join(' · ')}</div></div><span class="pill bad">${d.totalIssues}</span></div>`;
   });
 }
 
 const overdueHw=db.hw.filter(h=>!h.done&&h.due&&h.due<iso(new Date())).sort((a,b)=>a.due.localeCompare(b.due));
 if(overdueHw.length){
   h+='<h2 class="section-title">#Просрочено</h2>';
   overdueHw.forEach(x=>{
     const daysOverdue=Math.ceil((new Date()-pd(x.due))/864e5);
     h+=`<div class="card danger"><b class="serif" style="font-size:16px">${esc(x.subj)}</b><div style="margin-top:3px">${esc(x.text)}</div><small style="color:#ff2d2d;font-weight:800;margin-top:6px;display:block;text-transform:uppercase;letter-spacing:0.05em;font-size:10px">+${daysOverdue} дн. · дедлайн ${x.due.slice(8)}.${x.due.slice(5,7)}</small></div>`;
   });
 }
 
 const gs=groupAttStats();
 if(gs.total>0){
   h+='<h2 class="section-title">#Сводка</h2>';
   h+=`<div class="stats-grid">
     <div class="stat-box bad"><div class="num">${debtors.length}</div><div class="lbl">Должников</div></div>
     <div class="stat-box warn"><div class="num">${overdueHw.length}</div><div class="lbl">Просрочено ДЗ</div></div>
     <div class="stat-box ok"><div class="num">${gs.pct}%</div><div class="lbl">Посещаемость</div></div>
     <div class="stat-box blue"><div class="num">${db.students.length}</div><div class="lbl">Всего</div></div>
   </div>`;
 }
 return h}

function vMore(){

 <h2 class="section-title">#Бэкап</h2><div class="card"><small class="mut" style="display:block;margin-bottom:10px">Данные хранятся локально. Делай бэкап время от времени.</small><textarea id="bk" placeholder="Здесь появится бэкап. Для восстановления вставь его сюда"></textarea><div class="acts"><button class="ghost" data-a="bkshow">Показать</button><button class="ghost" data-a="bkcopy">Копировать</button><button class="dg" data-a="bkload">Восстановить</button></div></div>`}

 lsave:()=>{const o={subj:val('ls'),day:+$('#ld').value,start:$('#l1').value,end:$('#l2').value,room:val('lr'),teacher:$('#lt').value,wk:+$('#lw').value};if(!o.subj||!o.start)return toast('Нужны предмет и время');const l=db.lessons.find(x=>x.id===sh.l);l?Object.assign(l,o):db.lessons.push({id:uid(),...o});save();shut()},
 ldel:()=>{if(confirm('Удалить пару?')){db.lessons=db.lessons.filter(x=>x.id!==sh.l);save();shut()}},
 se:()=>openSheet(`<h3 class="serif">Добавить студентов</h3><small class="mut" style="display:block;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em">По одному на строку</small><textarea id="sn" style="min-height:200px"></textarea><button class="pr" data-a="ssave" style="width:100%">Добавить</button>`),
 ssave:()=>{$('#sn').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(n=>db.students.push({id:uid(),name:n}));save();shut()},
 sp:d=>{const s=db.students.find(x=>x.id===d.i);sh={s:s.id};const stats=studentAttStats(s.id);const statsHtml=stats.total?`<h3 class="serif">#Посещаемость</h3>${statsBlock(stats,s.name)}`:'';openSheet(`<h3 class="serif" style="font-size:24px">Профиль</h3><label>ФИО</label><input id="pnm" value="${esc(s.name)}"><label>Дата флюры</label><input type="date" id="pfl" value="${s.fl||''}"><label>Дата рождения</label><input type="date" id="pdob" value="${s.dob||''}"><label>Группа здоровья</label><input id="phg" placeholder="напр. I, II" value="${esc(s.hg)}"><label>Номер зачётки</label><input id="pzk" inputmode="numeric" value="${esc(s.zk)}"><label>Телефон</label><input id="pph" type="tel" value="${esc(s.phone)}"><label>Почта</label><input id="pml" type="email" value="${esc(s.mail)}">${statsHtml}<div class="acts"><button class="pr" data-a="spsave">Сохранить</button><button class="dg" data-a="spdel">Удалить</button></div>`)},
 spsave:()=>{const s=db.students.find(x=>x.id===sh.s),n=val('pnm');if(!n)return toast('Нужно ФИО');Object.assign(s,{name:n,fl:$('#pfl').value,dob:$('#pdob').value,hg:val('phg'),zk:val('pzk'),phone:val('pph'),mail:val('pml')});save();shut()},

 exp:async()=>{if(!db.students.length)return toast('Список пуст');const f=new File(['\ufeff'+csv()],'spisok.csv',{type:'text/csv'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='spisok.csv';document.body.appendChild(a);a.click();a.remove()},
