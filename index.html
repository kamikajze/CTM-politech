<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Староста">
<meta name="theme-color" content="#2b4bb8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ЦТМ</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#141a2b;--mut:#6b7488;--ac:#2b4bb8;--onac:#fff;--ln:#dde3ee;--ok:#2e8b57;--bad:#d23b3b;--warn:#c98a10;--in:#e9eef7}
@media(prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#171e30;--tx:#eef1fa;--mut:#8f9ab3;--ac:#8fa8ff;--onac:#0e1320;--ln:#26304a;--in:#212a42;--ok:#4cc58a;--bad:#ff6b6b;--warn:#e8b04a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:12px 14px 24px}
h2,h3{font:600 20px/1.2 ui-serif,"New York",Georgia,serif;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h3{margin:0 0 6px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--ln)}
.les{border-left:4px solid var(--ac)}
.row{display:flex;align-items:center;gap:12px}.fl{flex:1;min-width:0}
.mut,small{color:var(--mut)}
.tm{font-weight:600;font-variant-numeric:tabular-nums;min-width:46px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--in);border:0;border-radius:10px;padding:9px 14px}
button.pr{background:var(--ac);color:var(--onac);font-weight:600}
button.dg{color:var(--bad)}
h2 button{font-size:14px;padding:6px 12px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts button{flex:1}
input,select,textarea{width:100%;background:var(--in);border:0;border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:16px}
label{font-size:13px;color:var(--mut)}
textarea{min-height:90px;resize:vertical}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav .ttl{text-align:center;flex:1;font:600 20px/1.2 ui-serif,"New York",Georgia,serif}
.nav small{font:14px -apple-system,sans-serif}
.nav button{font-size:22px;padding:4px 16px}
.pill{display:inline-block;min-width:36px;text-align:center;padding:4px 10px;border-radius:99px;font-weight:600;font-size:14px;background:var(--in);color:var(--mut)}
.pill.ok{background:var(--ok);color:#fff}.pill.bad{background:var(--bad);color:#fff}.pill.warn{background:var(--warn);color:#fff}
.note{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--in);white-space:pre-wrap;font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border-radius:0;padding:8px 0 6px;font-size:11px;color:var(--mut);line-height:1.2}
#tabs button.on{color:var(--ac);font-weight:600}
#tabs span{display:block;font-size:20px}
.sheet{position:fixed;inset:0;display:none;z-index:9}.sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.srow{padding:11px 4px;border-bottom:1px solid var(--ln);justify-content:space-between}
.card .srow:last-child{border:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);padding:0;background:none;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok)}.done .fl{opacity:.5;text-decoration:line-through}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
a{color:var(--ac)}
.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--tx);margin:8px 0}
.ck input{width:22px;height:22px;margin:0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs"></nav>
<div id="sheet" class="sheet"><div class="bk" data-a="shut"></div><div class="pn" id="pn"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='starosta.v1',DN=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const ST={p:['✓','ok'],a:['н/б','bad'],e:['У','warn'],l:['оп.','warn']},ORD=['p','a','e','l'];
let db={};try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
db=Object.assign({students:[],teachers:[],lessons:[],att:{},notes:{},hw:[],ref:'2026-08-31'},db);
let tab='today',cur=new Date(),sh={};cur.setHours(12,0,0,0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Не удалось сохранить')}queue()};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const dow=d=>(d.getDay()+6)%7;
const monday=d=>{const m=new Date(d);m.setDate(d.getDate()-dow(d));m.setHours(12,0,0,0);return m};
const parity=d=>((Math.round((monday(d)-monday(pd(db.ref)))/6048e5)%2)+2)%2===0?1:2;
const lessonsFor=d=>{const w=parity(d);return db.lessons.filter(l=>l.day===dow(d)&&(!l.wk||l.wk===w)).sort((a,b)=>a.start.localeCompare(b.start))};
const tname=id=>(db.teachers.find(t=>t.id===id)||{}).name||'';
const val=id=>$('#'+id).value.trim();
const absCount=()=>{const c={};for(const k in db.att)for(const s in db.att[k])if(db.att[k][s]==='a')c[s]=(c[s]||0)+1;return c};


const SB={
  url:'https://jvnrfunimsbhoatbhoai.supabase.co', 
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2bnJmdW5pbXNiaG9hdGJob2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDQ5ODksImV4cCI6MjEwNjI4MDk4OX0.xwiQVKIz1k5MdjywyFjhe8g0aGjatYqtYAok1f9I-qo'
};

let ses=null,syn={m:{},last:''},stat='',busy=false,again=false,tm;
try{ses=JSON.parse(localStorage.getItem('starosta.sb'))}catch(e){}
try{syn=Object.assign(syn,JSON.parse(localStorage.getItem('starosta.syn')))}catch(e){}
const H=t=>({apikey:SB.key,...(t?{Authorization:'Bearer '+t}:{}),'Content-Type':'application/json'});
const setSes=j=>{ses={a:j.access_token,r:j.refresh_token,e:Date.now()+(j.expires_in-60)*1e3};localStorage.setItem('starosta.sb',JSON.stringify(ses))};

async function login(email,password){
  const r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify({email,password})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||'Не удалось войти');
  setSes(j);
}

async function token(){
  if(!ses) throw new Error('нужен вход');
  if(Date.now()>ses.e){
    const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:H(),body:JSON.stringify({refresh_token:ses.r})});
    const j=await r.json();
    if(!r.ok){ses=null;localStorage.removeItem('starosta.sb');throw new Error('нужно войти заново')}
    setSes(j);
  }
  return ses.a;
}

function rowsOf(){
  const r={};
  db.students.forEach(x=>r['student:'+x.id]=x);
  db.teachers.forEach(x=>r['teacher:'+x.id]=x);
  db.lessons.forEach(x=>r['lesson:'+x.id]=x);
  db.hw.forEach(x=>r['hw:'+x.id]=x);
  for(const k in db.att)for(const s in db.att[k])r['att:'+k+':'+s]={k,s,v:db.att[k][s]};
  for(const k in db.notes)r['note:'+k]={k,t:db.notes[k]};
  r['cfg:ref']={ref:db.ref};
  return r;
}

function applyRow(id,d,del){
  const i=id.indexOf(':'),kind=id.slice(0,i),rest=id.slice(i+1),L={student:'students',teacher:'teachers',lesson:'lessons',hw:'hw'}[kind];
  if(L){db[L]=db[L].filter(x=>x.id!==rest);if(!del&&d)db[L].push(d)}
  else if(kind==='att'){const[k,s]=rest.split(':');if(del||!d){if(db.att[k]){delete db.att[k][s];if(!Object.keys(db.att[k]).length)delete db.att[k]}}else(db.att[k]=db.att[k]||{})[s]=d.v}
  else if(kind==='note'){if(del||!d)delete db.notes[rest];else db.notes[rest]=d.t}
  else if(kind==='cfg'&&d&&d.ref)db.ref=d.ref;
}

function queue(){if(SB.url&&ses){clearTimeout(tm);tm=setTimeout(sync,900)}}

async function sync(){
  if(!SB.url||!ses) return;
  if(busy){ again=true; return; }
  busy=true;
  try{
    const t=await token();
    const cur=rowsOf(), m={}, up=[];
    for(const id in cur){
      const j=JSON.stringify(cur[id]);
      m[id]=j;
      if(syn.m[id]!==j) up.push({id, kind:id.split(':')[0], data:cur[id], deleted:false});
    }
    for(const id in syn.m){
      if(!(id in cur)) up.push({id, kind:id.split(':')[0], data:null, deleted:true});
    }
    if(up.length){
      const r=await fetch(SB.url+'/rest/v1/items?on_conflict=id', {
        method:'POST',
        headers:{...H(t), Prefer:'resolution=merge-duplicates'},
        body:JSON.stringify(up)
      });
      if(!r.ok) throw new Error(await r.text());
    }
    const since = syn.last ? `&updated_at=gt.${encodeURIComponent(syn.last)}` : '';
    let rows=[], o=0;
    for(;;){
      const r=await fetch(SB.url+`/rest/v1/items?select=*&order=updated_at.asc,id.asc${since}&limit=1000&offset=${o}`, {headers:H(t)});
      if(!r.ok) throw new Error(await r.text());
      const p=await r.json();
      rows=rows.concat(p);
      if(p.length<1000) break;
      o+=1000;
    }
    if(rows.length){
      rows.forEach(x=>applyRow(x.id, x.data, x.deleted));
      const now=rowsOf();
      rows.forEach(x=>{
        if(x.id in now) syn.m[x.id]=JSON.stringify(now[x.id]);
        else delete syn.m[x.id];
      });
      syn.last=rows[rows.length-1].updated_at;
      localStorage.setItem(KEY, JSON.stringify(db));
    }
    syn.m=m;
    localStorage.setItem('starosta.syn', JSON.stringify(syn));
    stat='обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    if(rows.length && !$('#sheet').classList.contains('on')) render();
  } catch(e){
    stat='ошибка: '+String(e.message).slice(0,90);
    console.error('Sync error:', e);
  } finally {
    busy=false;
    if(again){ again=false; sync(); }
  }
}

const syncCard=()=>`<h2>☁️ Общий доступ</h2><div class="card">${ses?`<small>✅ Вход выполнен. ${esc(stat)}</small><div class="acts"><button class="pr" data-a="syncnow">Синхронизировать</button><button class="dg" data-a="sblogout">Выйти</button></div>`:`<label>Почта</label><input id="sbe" type="email" autocomplete="username"><label>Пароль</label><input id="sbp" type="password" autocomplete="current-password"><button class="pr" data-a="sblogin" style="width:100%">Войти</button>`}</div>`;

const COLS=[['fl','Дата флюры'],['hg','Группа здоровья'],['zk','Номер зачётки'],['phone','Телефон'],['mail','Почта']];
let cols=['fl'];
const fdate=s=>s?s.split('-').reverse().join('.'):'';
const flOld=s=>s.fl&&Date.now()-pd(s.fl)>365*864e5;
const rows=()=>[['ФИО',...cols.map(k=>COLS.find(c=>c[0]===k)[1])],...db.students.map(s=>[s.name,...cols.map(k=>k==='fl'?fdate(s.fl):s[k]||'')])];
const csv=()=>rows().map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
const expCard=()=>`<h2>📥 Выгрузка списка</h2><div class="card"><small>ФИО будет всегда. Отметь остальные столбцы:</small><div id="cols">${COLS.map(([k,n])=>`<label class="ck"><input type="checkbox" value="${k}" ${cols.includes(k)?'checked':''}>${n}</label>`).join('')}</div><div class="acts"><button class="pr" data-a="exp">Скачать CSV</button><button data-a="expc">Копировать</button></div></div>`;

if(!db.seeded){
 if(!db.lessons.length&&!db.teachers.length){
  const T=[['Иванова М.В.','асс. · Цифровые платформы'],['Бельмас С.М.','ст. пр. · Бизнес-архитектуры, ФЯП, Big Data'],['Ахметова М.И.','доц. · Финансовое моделирование'],['Широков А.А.','доц. · ОС, сети и телекоммуникации'],['Леонтьева С.М.','ст. пр. · Бухгалтерский и управленческий учёт']].map(([name,subj])=>({id:uid(),name,subj,phone:'',tg:'',mail:''}));
  const BA='Проектирование бизнес-архитектур и моделирование бизнес-процессов',FM='Финансовое моделирование денежных потоков',OS='Операционные системы, сети и телекоммуникации',BU='Бухгалтерский и управленческий учёт',BD='Управление большими данными (Big Data)',FP='Функциональные языки программирования',DP='Цифровые платформы';
  db.teachers=T;
  db.lessons=[
   [0,'13:20','14:50',DP+' (пр)','516 гл.к.А',0],[0,'15:00','16:30',DP+' (лек)','502 гл.к.А',0],[0,'16:40','18:10',DP+' (пр)','516 гл.к.А',0],
   [1,'11:30','13:00',BA+' (лек)','509 гл.к.А',1],[1,'13:20','14:50',BA+' (пр)','509 гл.к.А',1],[1,'16:40','18:10',FP+' (лек)','дистант',1],[1,'18:20','19:50',FP+' (пр)','дистант',1],
   [3,'10:10','11:40','Прикладная физкультура, секции (пр)','Спортзал ФОК к.4 (СФ)',-1],[3,'15:00','16:30',BD+' (лек)','дистант',1],[3,'16:40','18:10',BD+' (пр)','дистант',1],
   [4,'13:20','14:50',FM+' (лек)','502 гл.к.А',2],[4,'15:00','16:30',FM+' (пр)','107 гл.к.А',2],[4,'16:40','18:10',FM+' (пр)','107 гл.к.А',2],
   [5,'09:40','11:10',OS+' (пр)','516 гл.к.А',3],[5,'11:30','13:00',OS+' (лек)','503 гл.к.А',3],[5,'13:20','14:50',BU+' (лек)','506 гл.к.А',4],[5,'15:00','16:30',BU+' (пр)','506 гл.к.А',4]
  ].map(([day,start,end,subj,room,t])=>({id:uid(),day,start,end,subj,room,teacher:t<0?'':T[t].id,wk:0}));
 }
 db.seeded=1;save();
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function openSheet(h){$('#pn').innerHTML=h;$('#sheet').classList.add('on')}
function shut(){$('#sheet').classList.remove('on');render()}

const hwRow=x=>{const od=x.due&&x.due<iso(new Date())&&!x.done;return `<div class="card row ${x.done?'done':''}"><button class="chk" data-a="hwd" data-i="${x.id}"></button><div class="fl" data-a="hwe" data-i="${x.id}"><b>${esc(x.subj)}</b><div>${esc(x.text)}</div>${x.due?`<small style="${od?'color:var(--bad)':''}">до ${x.due.slice(8)}.${x.due.slice(5,7)}${od?' · просрочено':''}</small>`:''}</div></div>`};

function vToday(){
 const d=cur,ls=lessonsFor(d),k=iso(d);
 const t=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
 let h=`<div class="nav"><button data-a="day" data-n="-1">‹</button><div class="ttl" data-a="now">${t[0].toUpperCase()+t.slice(1)}<br><small>${parity(d)===1?'нечётная':'чётная'} неделя${k===iso(new Date())?' · сегодня':' · тап — вернуться к сегодня'}</small></div><button data-a="day" data-n="1">›</button></div>`;
 if(!ls.length)h+='<div class="empty">В этот день пар нет<br><small>Расписание задаётся во вкладке «Пары»</small></div>';
 for(const l of ls){
  const a=db.att[k+'|'+l.id]||{},n=db.notes[k+'|'+l.id],ab=Object.values(a).filter(x=>x==='a').length,mk=Object.keys(a).length;
  h+=`<div class="card les"><div class="row"><div class="tm">${l.start}<br><small>${l.end}</small></div><div class="fl"><b>${esc(l.subj)}</b><div class="mut">${[l.room,tname(l.teacher)].filter(Boolean).map(esc).join(' · ')}</div></div>${mk?`<span class="pill ${ab?'bad':'ok'}">${ab?'н/б '+ab:'✓'}</span>`:''}</div><div class="acts"><button data-a="att" data-l="${l.id}">Посещаемость</button><button data-a="note" data-l="${l.id}">Заметка</button></div>${n?`<div class="note">${esc(n)}</div>`:''}</div>`}
 const hw=db.hw.filter(x=>!x.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,5);
 if(hw.length)h+='<h2>Ближайшие ДЗ</h2>'+hw.map(hwRow).join('');
 return h}

function vSched(){
 let h='<h2>Расписание <button class="pr" data-a="le" data-l="">+ Пара</button></h2>';
 for(let i=0;i<6;i++){
  const ls=db.lessons.filter(l=>l.day===i).sort((a,b)=>a.start.localeCompare(b.start));
  if(!ls.length)continue;
  h+=`<h3 style="margin:16px 2px 8px">${DN[i]}</h3>`+ls.map(l=>`<div class="card les row" data-a="le" data-l="${l.id}"><div class="tm">${l.start}<br><small>${l.end}</small></div><div class="fl"><b>${esc(l.subj)}</b><div class="mut">${[l.room,tname(l.teacher),['','нечёт.','чёт.'][l.wk||0]].filter(Boolean).map(esc).join(' · ')}</div></div></div>`).join('')}
 if(!db.lessons.length)h+='<div class="empty">Пока пусто. Добавь первую пару кнопкой сверху</div>';
 return h}

function vHw(){
 const u=db.hw.filter(x=>!x.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')),dn=db.hw.filter(x=>x.done);
 let h='<h2>Домашки <button class="pr" data-a="hwe" data-i="">+ Задание</button></h2>';
 h+=u.length?u.map(hwRow).join(''):'<div class="empty">Невыполненных заданий нет</div>';
 if(dn.length)h+=`<h2>Готово (${dn.length})</h2>`+dn.map(hwRow).join('');
 return h}

function vGroup(){
 const c=absCount();
 let h=`<h2>Студенты (${db.students.length}) <button class="pr" data-a="se">+ Добавить</button></h2><div class="card">`;
 h+=db.students.length?db.students.map((s,i)=>`<div class="row srow" data-a="sp" data-i="${s.id}"><span class="fl">${i+1}. ${esc(s.name)}${s.fl?`<br><small ${flOld(s)?'style="color:var(--bad)"':''}>флюра: ${fdate(s.fl)}${flOld(s)?' · больше года':''}</small>`:''}</span><small>н/б: ${c[s.id]||0} ›</small></div>`).join(''):'<div class="empty">Добавь студентов списком, по одному на строку</div>';
 h+='</div>'+expCard()+'<h2>Преподаватели <button class="pr" data-a="te" data-i="">+ Препод</button></h2>';
 h+=db.teachers.map(t=>`<div class="card"><div class="row" data-a="te" data-i="${t.id}"><div class="fl"><b>${esc(t.name)}</b><div class="mut">${esc(t.subj)}</div></div></div><div class="acts">${t.phone?`<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>`:''}${t.tg?`<a href="https://t.me/${esc(t.tg.replace('@',''))}">@${esc(t.tg.replace('@',''))}</a>`:''}${t.mail?`<a href="mailto:${esc(t.mail)}">${esc(t.mail)}</a>`:''}</div></div>`).join('');
 return h}

function vMore(){
 return (SB.url?syncCard():'')+`<h2>Настройки</h2><div class="card"><label>Понедельник любой нечётной недели</label><input type="date" id="ref" value="${db.ref}"><small>Сейчас: ${parity(new Date())===1?'нечётная':'чётная'} неделя</small></div>
 <h2>Бэкап</h2><div class="card"><small>Данные хранятся только на этом телефоне. Время от времени копируй бэкап и сохраняй в заметки.</small><textarea id="bk" placeholder="Здесь появится бэкап. Для восстановления вставь его сюда"></textarea><div class="acts"><button data-a="bkshow">Показать</button><button data-a="bkcopy">Копировать</button><button class="dg" data-a="bkload">Восстановить</button></div></div>`}

function attSheet(){
 const l=db.lessons.find(x=>x.id===sh.l),a=db.att[sh.k+'|'+sh.l]||{},st=$('#pn').scrollTop;
 openSheet(`<h3>${esc(l.subj)}</h3><small>Тап по строке меняет статус: ✓ был, н/б, У уважительная, оп. опоздал</small><div class="acts"><button data-a="allp">Все были</button><button class="pr" data-a="shut">Готово</button></div>`+(db.students.length?db.students.map(s=>{const v=a[s.id],[t,c]=v?ST[v]:['—',''];return `<div class="row srow" data-a="cyc" data-s="${s.id}"><span>${esc(s.name)}</span><span class="pill ${c}">${t}</span></div>`}).join(''):'<div class="empty">Сначала добавь студентов во вкладке «Группа»</div>'));
 $('#pn').scrollTop=st}

const A={
 day:d=>{cur.setDate(cur.getDate()+ +d.n);render()},
 now:()=>{cur=new Date();cur.setHours(12,0,0,0);render()},
 tab:d=>{tab=d.t;scrollTo(0,0);render()},
 shut,
 att:d=>{sh={l:d.l,k:iso(cur)};attSheet()},
 cyc:d=>{const key=sh.k+'|'+sh.l,a=db.att[key]=db.att[key]||{},n=ORD[ORD.indexOf(a[d.s])+1];n?a[d.s]=n:delete a[d.s];save();attSheet()},
 allp:()=>{const key=sh.k+'|'+sh.l,a=db.att[key]=db.att[key]||{};db.students.forEach(s=>a[s.id]='p');save();attSheet()},
 note:d=>{sh={l:d.l,k:iso(cur)};openSheet(`<h3>Заметка к паре</h3><textarea id="nt" placeholder="Тема, что сдать, что принести">${esc(db.notes[sh.k+'|'+sh.l]||'')}</textarea><button class="pr" data-a="nsave" style="width:100%">Сохранить</button>`)},
 nsave:()=>{const v=val('nt'),key=sh.k+'|'+sh.l;v?db.notes[key]=v:delete db.notes[key];save();shut()},
 le:d=>{const l=db.lessons.find(x=>x.id===d.l)||{day:dow(cur)>5?0:dow(cur),start:'08:30',end:'10:00',subj:'',room:'',teacher:'',wk:0};sh={l:l.id||''};
  openSheet(`<h3>${l.id?'Пара':'Новая пара'}</h3><label>Предмет</label><input id="ls" value="${esc(l.subj)}"><label>День</label><select id="ld">${DN.slice(0,6).map((n,i)=>`<option value="${i}" ${i===l.day?'selected':''}>${n}</option>`).join('')}</select><div class="row"><div class="fl"><label>Начало</label><input type="time" id="l1" value="${l.start}"></div><div class="fl"><label>Конец</label><input type="time" id="l2" value="${l.end}"></div></div><label>Аудитория</label><input id="lr" value="${esc(l.room)}"><label>Преподаватель</label><select id="lt"><option value="">—</option>${db.teachers.map(t=>`<option value="${t.id}" ${t.id===l.teacher?'selected':''}>${esc(t.name)}</option>`).join('')}</select><label>Неделя</label><select id="lw">${['Каждая','Нечётная','Чётная'].map((n,i)=>`<option value="${i}" ${i===(l.wk||0)?'selected':''}>${n}</option>`).join('')}</select><div class="acts"><button class="pr" data-a="lsave">Сохранить</button>${l.id?'<button class="dg" data-a="ldel">Удалить</button>':''}</div>`)},
 lsave:()=>{const o={subj:val('ls'),day:+$('#ld').value,start:$('#l1').value,end:$('#l2').value,room:val('lr'),teacher:$('#lt').value,wk:+$('#lw').value};if(!o.subj||!o.start)return toast('Нужны предмет и время начала');const l=db.lessons.find(x=>x.id===sh.l);l?Object.assign(l,o):db.lessons.push({id:uid(),...o});save();shut()},
 ldel:()=>{if(confirm('Удалить пару?')){db.lessons=db.lessons.filter(x=>x.id!==sh.l);save();shut()}},
 se:()=>openSheet(`<h3>Добавить студентов</h3><small>По одному на строку</small><textarea id="sn" style="min-height:200px"></textarea><button class="pr" data-a="ssave" style="width:100%">Добавить</button>`),
 ssave:()=>{$('#sn').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(n=>db.students.push({id:uid(),name:n}));save();shut()},
 sp:d=>{const s=db.students.find(x=>x.id===d.i);sh={s:s.id};openSheet(`<h3>Профиль</h3><label>ФИО</label><input id="pnm" value="${esc(s.name)}"><label>Дата последней флюры</label><input type="date" id="pfl" value="${s.fl||''}"><label>Группа здоровья</label><input id="phg" placeholder="напр. I, II или основная" value="${esc(s.hg)}"><label>Номер зачётки</label><input id="pzk" inputmode="numeric" value="${esc(s.zk)}"><label>Телефон</label><input id="pph" type="tel" value="${esc(s.phone)}"><label>Почта</label><input id="pml" type="email" value="${esc(s.mail)}"><div class="acts"><button class="pr" data-a="spsave">Сохранить</button><button class="dg" data-a="spdel">Удалить</button></div>`)},
 spsave:()=>{const s=db.students.find(x=>x.id===sh.s),n=val('pnm');if(!n)return toast('Нужно ФИО');Object.assign(s,{name:n,fl:$('#pfl').value,hg:val('phg'),zk:val('pzk'),phone:val('pph'),mail:val('pml')});save();shut()},
 spdel:()=>{const s=db.students.find(x=>x.id===sh.s);if(confirm('Удалить «'+s.name+'»?')){db.students=db.students.filter(x=>x!==s);save();shut()}},
 exp:async()=>{if(!db.students.length)return toast('Список пуст');const f=new File(['\ufeff'+csv()],'spisok.csv',{type:'text/csv'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='spisok.csv';document.body.appendChild(a);a.click();a.remove()},
 expc:async()=>{try{await navigator.clipboard.writeText(rows().map(r=>r.join('\t')).join('\n'));toast('Скопировано, вставляй в Excel или Таблицы')}catch(e){toast('Не удалось скопировать')}},
 te:d=>{const t=db.teachers.find(x=>x.id===d.i)||{name:'',subj:'',phone:'',tg:'',mail:''};sh={t:t.id||''};
  openSheet(`<h3>Преподаватель</h3><label>ФИО</label><input id="tn" value="${esc(t.name)}"><label>Предмет</label><input id="ts" value="${esc(t.subj)}"><label>Телефон</label><input id="tp" type="tel" value="${esc(t.phone)}"><label>Telegram</label><input id="tg" placeholder="@username" value="${esc(t.tg)}"><label>Почта</label><input id="tm" type="email" value="${esc(t.mail)}"><div class="acts"><button class="pr" data-a="tsave">Сохранить</button>${t.id?'<button class="dg" data-a="tdel">Удалить</button>':''}</div>`)},
 tsave:()=>{const o={name:val('tn'),subj:val('ts'),phone:val('tp'),tg:val('tg'),mail:val('tm')};if(!o.name)return toast('Нужно ФИО');const t=db.teachers.find(x=>x.id===sh.t);t?Object.assign(t,o):db.teachers.push({id:uid(),...o});save();shut()},
 tdel:()=>{if(confirm('Удалить преподавателя?')){db.teachers=db.teachers.filter(x=>x.id!==sh.t);save();shut()}},
 hwd:d=>{const x=db.hw.find(h=>h.id===d.i);x.done=!x.done;save();render()},
 hwe:d=>{const x=db.hw.find(h=>h.id===d.i)||{subj:'',text:'',due:''};sh={h:x.id||''};const subs=[...new Set(db.lessons.map(l=>l.subj))];
  openSheet(`<h3>Домашнее задание</h3><label>Предмет</label><input id="hs" list="hl" value="${esc(x.subj)}"><datalist id="hl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><label>Что задано</label><textarea id="ht">${esc(x.text)}</textarea><label>Срок сдачи</label><input type="date" id="hd" value="${x.due}"><div class="acts"><button class="pr" data-a="hsave">Сохранить</button>${x.id?'<button class="dg" data-a="hdel">Удалить</button>':''}</div>`)},
 hsave:()=>{const o={subj:val('hs'),text:val('ht'),due:$('#hd').value};if(!o.text)return toast('Впиши задание');const x=db.hw.find(h=>h.id===sh.h);x?Object.assign(x,o):db.hw.push({id:uid(),done:false,...o});save();shut()},
 hdel:()=>{db.hw=db.hw.filter(h=>h.id!==sh.h);save();shut()},
 sblogin:async()=>{try{await login(val('sbe'),val('sbp'));toast('Вход выполнен');await sync();render()}catch(e){toast(e.message)}},
 sblogout:()=>{ses=null;localStorage.removeItem('starosta.sb');render()},
 syncnow:async()=>{await sync();render();toast(stat)},
 bkshow:()=>{$('#bk').value=JSON.stringify(db)},
 bkcopy:async()=>{const t=$('#bk');if(!t.value)t.value=JSON.stringify(db);try{await navigator.clipboard.writeText(t.value);toast('Скопировано')}catch(e){t.select();toast('Скопируй выделенное вручную')}},
 bkload:()=>{try{const o=JSON.parse($('#bk').value);if(!o.students||!o.lessons)throw 0;if(confirm('Заменить все данные бэкапом?')){db=Object.assign(db,o);save();render();toast('Восстановлено')}}catch(e){toast('Это не похоже на бэкап')}}
};

const TABS=[['today','📅','Сегодня'],['sched','🗓','Пары'],['hw','📝','ДЗ'],['group','👥','Группа'],['more','⚙️','Ещё']];
const V={today:vToday,sched:vSched,hw:vHw,group:vGroup,more:vMore};
function render(){db.students.sort((a,b)=>a.name.localeCompare(b.name,'ru'));$('#app').innerHTML=V[tab]();$('#tabs').innerHTML=TABS.map(([k,i,n])=>`<button class="${k===tab?'on':''}" data-a="tab" data-t="${k}"><span>${i}</span>${n}</button>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('change',e=>{if(e.target.closest('#cols'))cols=[...document.querySelectorAll('#cols input:checked')].map(i=>i.value);if(e.target.id==='ref'&&e.target.value){db.ref=e.target.value;save();render()}});
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
